<sly data-sly-use.model="br.com.caroline.intibiome.core.models.MinimalCarouselModel"/>
<section id="${model.id}" class="cmp-minimal-carousel carousel slide container-fluid px-0"
    data-cmp-is="minimal-carousel" data-panelcontainer="carousel"
    data-bs-ride="${model.autoplay ? 'carousel' : ''}"
    data-bs-interval="${model.interval}" data-bs-pause="false">
  <div class="cmp-minimal-carousel__viewport carousel-inner" aria-live="polite">
    <sly data-sly-list.slideName="${model.slideNames}">
      <sly data-sly-resource="${slideName}"></sly>
    </sly>
  </div>
  <div class="cmp-minimal-carousel__controls d-flex align-items-center justify-content-center" data-sly-test="${model.slideNames.size > 1}">
    <button class="carousel-control-prev" type="button" data-bs-target="#${model.id}" data-bs-slide="prev"><span aria-hidden="true">&#8249;</span><span class="visually-hidden">Slide anterior</span></button>
    <div class="cmp-minimal-carousel__dots carousel-indicators position-static m-0">
      <sly data-sly-list.slideName="${model.slideNames}"><button type="button" data-bs-target="#${model.id}" data-bs-slide-to="${slideNameList.index}" class="${slideNameList.first ? 'active' : ''}" aria-current="${slideNameList.first ? 'true' : 'false'}" aria-label="Ir para o slide ${slideNameList.count}"></button></sly>
    </div>
    <button class="carousel-control-next" type="button" data-bs-target="#${model.id}" data-bs-slide="next"><span aria-hidden="true">&#8250;</span><span class="visually-hidden">Próximo slide</span></button>
    <button type="button" class="cmp-minimal-carousel__pause" data-action="pause" aria-label="Pausar carrossel" aria-pressed="false"><span></span><span></span></button>
  </div>
  <sly data-sly-resource="${resource.path @ resourceType='wcm/foundation/components/parsys/newpar', appendPath='/*', decorationTagName='div', cssClassName='new section aem-Grid-newComponent'}" data-sly-test="${wcmmode.edit}"></sly>
  <p class="cmp-minimal-carousel__empty" data-sly-test="${!model.slideNames.size && wcmmode.edit}">Adicione componentes Minimal Beauty Slide ao carrossel.</p>
</section>
