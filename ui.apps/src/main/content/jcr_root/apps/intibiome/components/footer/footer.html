<sly data-sly-use.footer="br.com.caroline.intibiome.core.models.FooterModel"/>
<div class="cmp-minimal-footer">
  <div class="cmp-minimal-footer__content container-xl">
    <div class="row gy-5 gx-lg-5">
      <div class="cmp-minimal-footer__brand col-12 col-md-4 col-lg-2">
        <img data-sly-test="${footer.logoReference}" src="${footer.logoReference @ context='uri'}" alt="${footer.logoAlt}"/>
        <span data-sly-test="${!footer.logoReference}" class="cmp-minimal-footer__monogram" aria-label="${footer.logoAlt}"><span>M</span><span>B</span><sup>&reg;</sup></span>
      </div>
      <section class="cmp-minimal-footer__about col-12 col-md-8 col-lg-4">
        <h2>${footer.aboutTitle}</h2><p>${footer.aboutText}</p>
        <div class="cmp-minimal-footer__social d-flex">
          <a data-sly-test="${footer.facebookLink}" href="${footer.facebookLink @ context='uri'}" aria-label="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-8h2.8l.4-3h-3.2V8.1c0-.9.3-1.6 1.7-1.6H17V3.8c-.8-.1-1.6-.2-2.4-.2-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.5v8z"/></svg></a>
          <a data-sly-test="${footer.instagramLink}" href="${footer.instagramLink @ context='uri'}" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
          <a data-sly-test="${footer.youtubeLink}" href="${footer.youtubeLink @ context='uri'}" aria-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8.2a3 3 0 00-2.1-2.1C17 5.6 12 5.6 12 5.6s-5 0-6.9.5A3 3 0 003 8.2 31 31 0 003 12a31 31 0 00.5 3.8 3 3 0 002.1 2.1c1.9.5 6.9.5 6.9.5s5 0 6.9-.5a3 3 0 002.1-2.1A31 31 0 0021 12a31 31 0 00-.5-3.8z"/><path class="cmp-minimal-footer__play" d="M10 9l5 3-5 3z"/></svg></a>
        </div>
      </section>
      <nav class="cmp-minimal-footer__column col-12 col-md-4 col-lg-2" aria-label="${footer.categoriesTitle}"><h2>${footer.categoriesTitle}</h2><ul class="list-unstyled" data-sly-list.item="${footer.categories}"><li><a href="${item.link @ context='uri'}">${item.label}</a></li></ul></nav>
      <nav class="cmp-minimal-footer__column col-12 col-md-8 col-lg-4" aria-label="${footer.informationTitle}"><h2>${footer.informationTitle}</h2><ul class="list-unstyled" data-sly-list.item="${footer.information}"><li><a href="${item.link @ context='uri'}">${item.label}</a></li></ul></nav>
    </div>
  </div>
  <div class="cmp-minimal-footer__bottom d-flex flex-column align-items-center">
    <div class="cmp-minimal-footer__payments d-flex flex-wrap justify-content-center" aria-label="Meios de pagamento"><span>AMEX</span><span>ELO</span><span>HIPERCARD</span><span>●●</span><span>VISA</span></div>
    <small>${footer.copyright}</small>
  </div>
</div>
